# ============================================================================
# ARCHIVO: .github/workflows/orquestador_diario.yml  (el DESPERTADOR)  · VERSIÓN 2 · SEMANA 7
# Novedades: casilla de simulacro, guardado SIEMPRE de la bitácora y la salud,
# y la alerta: abre un Issue si el robot falla y lo cierra cuando se recupera.
# ============================================================================
name: Orquestador diario G02

on:
  schedule:
    - cron: "0 10 * * *"      # reloj del equipo: minuto 0, hora 10 UTC
  workflow_dispatch:         # botón Run workflow en la pestaña Actions
    inputs:
      simular_falla:
        description: "Simulacro: provocar una falla para probar la alerta"
        type: boolean
        default: false

permissions:
  contents: write            # guardar datos en la casa
  issues: write              # abrir y cerrar alertas

concurrency:
  group: orquestador-g02
  cancel-in-progress: false

jobs:
  correr-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL_CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lo necesario
        run: pip install -r requirements.txt

      - name: Correr el robot del Banco Mundial
        env:
          SIMULAR_FALLA: ${{ inputs.simular_falla }}
        run: python robot_banco_mundial.py

      # Se hace SIEMPRE (if: always()): así también queda guardado el registro de las fallas.
      - name: Guardar datos, bitácora y salud (siempre)
        if: always()
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add data/ logs/
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Corrida ${{ github.run_number }} del $(date -u +%Y-%m-%d) (${{ job.status }})"
            git pull --rebase --quiet && git push
          fi

      # LA ALERTA: solo si algo falló (if: failure()). Si ya hay una abierta, comenta en ella.
      - name: Abrir o actualizar la alerta
        if: failure()
        run: |
          gh label create alerta-robot --color C8102E --description "El robot del observatorio falló" --force
          ABIERTA=$(gh issue list --label alerta-robot --state open --json number --jq '.[].number' | head -n 1)
          if [ -n "$ABIERTA" ]; then
            gh issue comment "$ABIERTA" --body "Volvió a fallar el $(date -u '+%Y-%m-%d %H:%M') UTC. Detalle: $URL_CORRIDA"
          else
            gh issue create --label alerta-robot --title "🚨 El robot G02 falló" \
              --body "El robot falló el $(date -u '+%Y-%m-%d %H:%M') UTC. Detalle: $URL_CORRIDA · Revisen logs/salud_g02.csv. Esta alerta se cierra sola cuando el robot vuelva a funcionar."
          fi

      # Si todo salió bien y había una alerta abierta, se cierra con una nota.
      - name: Cerrar la alerta si el robot se recuperó
        if: success()
        run: |
          for n in $(gh issue list --label alerta-robot --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recuperado: la corrida del $(date -u '+%Y-%m-%d %H:%M') UTC terminó bien. $URL_CORRIDA"
          done
